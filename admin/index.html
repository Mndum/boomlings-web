<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Boomlings Admin</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --ink:#18202f; --mute:#667085; --line:#e3e8f2; --brand:#1b78e0; --brand-ink:#fff; --good:#12a150; --bad:#d92d20; --warn:#b54708; --chip:#eaf1fc; --shadow:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1420; --card:#171f2f; --ink:#e8edf7; --mute:#95a1b8; --line:#26314a; --brand:#4a98f0; --brand-ink:#08121f; --good:#3ccb7f; --bad:#ff6b5e; --warn:#f5a623; --chip:#1f2c45; --shadow:0 1px 3px rgba(0,0,0,.4); } }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  button,input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  h1,h2,h3 { margin:0; }
  .hidden { display:none !important; }

  /* sign-in */
  #login { min-height:100vh; display:grid; place-items:center; padding:16px; }
  #login form { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; width:100%; max-width:380px; box-shadow:var(--shadow); }
  #login h1 { font-size:24px; margin-bottom:4px; }
  #login p { color:var(--mute); margin:0 0 18px; }

  /* layout: sidebar on wide screens, bottom bar on phones */
  #app { display:grid; grid-template-columns:230px 1fr; min-height:100vh; }
  nav { background:var(--card); border-right:1px solid var(--line); padding:18px 12px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px; }
  nav .brand { font-weight:800; font-size:18px; padding:4px 12px 16px; }
  nav .brand small { display:block; font-weight:500; color:var(--mute); font-size:12px; }
  nav a { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; color:var(--ink); text-decoration:none; font-weight:600; }
  nav a .ic { font-size:20px; width:24px; text-align:center; }
  nav a:hover { background:var(--chip); }
  nav a.on { background:var(--brand); color:var(--brand-ink); }
  nav .grow { flex:1; }
  nav button.out { background:none; border:1px solid var(--line); border-radius:12px; padding:10px; color:var(--mute); }
  main { padding:24px clamp(14px,3vw,36px) 48px; max-width:1100px; width:100%; }
  main > h2 { font-size:26px; margin-bottom:4px; }
  main > .sub { color:var(--mute); margin:0 0 20px; }
  @media (max-width:760px) {
    #app { grid-template-columns:1fr; padding-bottom:72px; }
    nav { position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; flex-direction:row; border-right:0; border-top:1px solid var(--line); padding:6px; z-index:5; justify-content:space-around; }
    nav .brand, nav .grow, nav button.out { display:none; }
    nav a { flex-direction:column; gap:2px; padding:6px 10px; font-size:12px; }
    main { padding-top:16px; }
  }

  /* cards, lists */
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); text-align:left; }
  .stat b { display:block; font-size:28px; line-height:1.1; }
  .stat span { color:var(--mute); font-size:13px; }
  button.stat:hover { border-color:var(--brand); }
  .cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .card > h3 { font-size:15px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .row { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); width:100%; background:none; border-left:0; border-right:0; border-top:0; text-align:left; }
  .row:last-child { border-bottom:0; }
  button.row:hover { background:var(--chip); }
  .av { width:38px; height:38px; border-radius:50%; background:var(--chip); display:grid; place-items:center; font-weight:800; color:var(--brand); flex:none; }
  .grow { flex:1; min-width:0; }
  .nm { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mute { color:var(--mute); font-size:13px; }
  .badge { font-size:12px; font-weight:700; padding:2px 8px; border-radius:99px; background:var(--chip); color:var(--brand); }
  .badge.bad { background:color-mix(in srgb,var(--bad) 16%,transparent); color:var(--bad); }
  .empty { padding:28px 16px; text-align:center; color:var(--mute); }
  .bars { display:flex; align-items:flex-end; gap:6px; height:110px; padding:16px; }
  .bars div { flex:1; background:var(--brand); border-radius:6px 6px 0 0; min-height:3px; position:relative; opacity:.85; }
  .bars div:hover { opacity:1; }
  .bars div i { position:absolute; top:-18px; left:0; right:0; text-align:center; font-size:11px; font-style:normal; color:var(--mute); }

  /* toolbar */
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .search { flex:1; min-width:200px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
  .chip { padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); font-weight:600; }
  .chip.on { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
  .btn { padding:11px 16px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-weight:600; }
  .btn:hover { border-color:var(--brand); }
  .btn.primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
  .btn.danger { color:var(--bad); }
  .btn.danger:hover { border-color:var(--bad); }
  .btn.solid-danger { background:var(--bad); color:#fff; border-color:var(--bad); }
  input.f { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:12px; color:var(--mute); padding:10px 16px; border-bottom:1px solid var(--line); text-transform:uppercase; letter-spacing:.04em; }
  td { padding:10px 16px; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:0; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }

  /* player sheet */
  #sheetWrap { position:fixed; inset:0; background:rgba(8,14,26,.55); z-index:20; display:flex; justify-content:flex-end; }
  #sheet { background:var(--bg); width:min(520px,100%); height:100%; overflow:auto; padding:20px; animation:in .18s ease-out; }
  @keyframes in { from { transform:translateX(30px); opacity:0; } to { transform:none; opacity:1; } }
  #sheet header { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  #sheet header .av { width:52px; height:52px; font-size:22px; }
  #sheet h3 { font-size:22px; }
  .close { margin-left:auto; background:var(--card); border:1px solid var(--line); border-radius:50%; width:40px; height:40px; font-size:18px; }
  .info { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .info div { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .info small { display:block; color:var(--mute); font-size:12px; }
  .sec { margin-bottom:18px; }
  .sec h4 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); }
  .act { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .act .btn { white-space:nowrap; }
  .banned-note { background:color-mix(in srgb,var(--bad) 12%,transparent); border:1px solid var(--bad); border-radius:12px; padding:10px 12px; margin-bottom:16px; }
  a.link { color:var(--brand); cursor:pointer; text-decoration:underline; }


  .bi { width:38px; height:38px; object-fit:contain; flex:none; }
  .bi.big { width:56px; height:56px; }
  /* live view + pranks */
  .live { display:grid; grid-template-columns:minmax(220px,300px) 1fr; gap:16px; align-items:start; }
  @media (max-width:760px) { .live { grid-template-columns:1fr; } }
  .pl { display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:10px 14px; }
  .pl:hover, .pl.on { background:var(--chip); }
  .pl img { width:44px; height:64px; object-fit:cover; border-radius:6px; background:#071a42; flex:none; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--good); margin-right:6px; }
  .screen { display:flex; gap:16px; padding:16px; flex-wrap:wrap; }
  .screen img { width:216px; height:360px; border-radius:12px; background:#071a42; border:1px solid var(--line); }
  .kv { display:grid; grid-template-columns:1fr 1fr; gap:8px; flex:1; min-width:180px; align-content:start; }
  .kv div { background:var(--bg); border-radius:10px; padding:8px 10px; }
  .kv small { display:block; color:var(--mute); font-size:12px; }
  .pranks { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; padding:0 16px 16px; }
  .pranks .btn { display:flex; flex-direction:column; align-items:center; gap:2px; padding:12px 6px; }
  .pranks .btn span { font-size:26px; line-height:1; }
  .pranks .btn small { color:var(--mute); font-weight:500; text-align:center; }
  .tgt { display:flex; gap:8px; padding:0 16px 12px; flex-wrap:wrap; align-items:center; }

  /* confirm + toast */
  #dlgWrap { position:fixed; inset:0; background:rgba(8,14,26,.6); z-index:40; display:grid; place-items:center; padding:16px; }
  #dlg { background:var(--card); border-radius:16px; padding:22px; width:min(420px,100%); box-shadow:var(--shadow); }
  #dlg h3 { margin-bottom:8px; }
  #dlg .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:12px; z-index:50; font-weight:600; max-width:90vw; }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>Boomlings Admin</h1>
    <p>Sign in to moderate your server.</p>
    <input id="user" class="f" placeholder="Username" autocomplete="username" autocapitalize="off" spellcheck="false" autofocus>
    <input id="key" class="f" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:10px">
    <p id="loginErr" class="mute" style="color:var(--bad);margin:10px 0 0"></p>
    <button class="btn primary" style="width:100%;margin-top:14px" type="submit">Sign in</button>
  </form>
</div>

<div id="app" class="hidden">
  <nav>
    <div class="brand">Boomlings<small>Server admin</small></div>
    <a href="#/overview" data-t="overview"><span class="ic">🏠</span>Overview</a>
    <a href="#/players" data-t="players"><span class="ic">👥</span>Players</a>
    <a href="#/live" data-t="live"><span class="ic">🎭</span>Live &amp; Pranks</a>
    <a href="#/leaderboard" data-t="leaderboard"><span class="ic">🏆</span>Leaderboard</a>
    <a href="#/ratings" data-t="ratings"><span class="ic">⭐</span>Reviews</a>
    <a href="#/log" data-t="log"><span class="ic">📋</span>Activity</a>
    <div class="grow"></div>
    <button class="out" id="signOut">Sign out</button>
  </nav>
  <main id="main"></main>
</div>

<div id="sheetWrap" class="hidden"><aside id="sheet"></aside></div>
<div id="dlgWrap" class="hidden"><div id="dlg"></div></div>
<div id="toast" class="hidden"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n || 0).toLocaleString();
const ago = (t) => { const s = Math.floor(Date.now() / 1000 - t); if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; if (s < 86400 * 30) return Math.floor(s / 86400) + ' d ago'; return new Date(t * 1000).toLocaleDateString(); };
const when = (t) => new Date(t * 1000).toLocaleString();

let KEY = sessionStorage.getItem('adminToken') || '';

async function api(method, path, body) {
  const r = await fetch('/api/admin/' + path, { method, headers: { 'x-admin-token': KEY, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: 'Server did not answer with JSON (is this the Worker?)' }));
  if (r.status === 401) { signOut(); throw new Error(j.error || 'Signed out'); }
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 3200); }
const fail = (e) => toast('⚠ ' + e.message);

// ---- small dialogs: confirm / prompt with inputs
function dialog({ title, text = '', fields = [], ok = 'OK', danger = false }) {
  return new Promise((res) => {
    const w = $('#dlgWrap'), d = $('#dlg');
    d.innerHTML = `<h3>${esc(title)}</h3><div class="mute">${text}</div>` + fields.map((f, i) => `<div style="margin-top:12px"><div class="mute" style="margin-bottom:4px">${esc(f.label)}</div><input class="f" data-i="${i}" type="${f.type || 'text'}" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}"></div>`).join('') + `<div class="btns"><button class="btn" id="dNo">Cancel</button><button class="btn ${danger ? 'solid-danger' : 'primary'}" id="dYes">${esc(ok)}</button></div>`;
    w.classList.remove('hidden');
    const done = (v) => { w.classList.add('hidden'); document.removeEventListener('keydown', kd); res(v); };
    const get = () => fields.map((_, i) => d.querySelector(`[data-i="${i}"]`).value);
    const kd = (e) => { if (e.key === 'Escape') done(null); if (e.key === 'Enter') done(get()); };
    document.addEventListener('keydown', kd);
    $('#dNo').onclick = () => done(null); $('#dYes').onclick = () => done(get());
    const first = d.querySelector('input'); if (first) first.focus();
  });
}


// ---- Boomlings icons: drawn from the game's own icon sheet, so the admin shows exactly what the player picked
let ICONS = null;
function loadIcons() {
  return ICONS || (ICONS = (async () => {
    const { Atlas } = await import('/js/atlas.js'), { parsePlist, fetchText } = await import('/js/plist.js');
    const [atlas, store] = await Promise.all([Atlas.load('/assets/boomIconSheet-hd'), fetchText('/data/store.plist').then(parsePlist)]);
    const titles = {}; Object.entries(store.Icons || {}).forEach(([id, v]) => { if (v && typeof v === 'object') titles[id] = v.title; });
    return { atlas, titles, cache: {} };
  })().catch(() => null));
}
const iconTitle = (id) => (ICONS && ICONS.v && ICONS.v.titles[id]) || '';
function icon(id, cls = '') {
  const I = ICONS && ICONS.v; if (!I || !/^kIcon_\d{3}$/.test(id || '')) return '';
  if (!I.cache[id]) {
    const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'), name = 'boomIcon_' + String(+id.slice(6)).padStart(2, '0') + '_001.png';
    const [w, h] = I.atlas.size(name); if (!w) return '';
    I.atlas.draw(x, name, 64, 64, { scale: Math.min(1, 120 / Math.max(w, h)) }); I.cache[id] = c.toDataURL();
  }
  return `<img class="bi ${cls}" src="${I.cache[id]}" alt="${esc(iconTitle(id))}" title="${esc(iconTitle(id))}">`;
}
const avatar = (name, id, cls = '') => icon(id, cls) || `<div class="av">${esc(String(name)[0].toUpperCase())}</div>`;

// ---- sign in / out
async function enter() {
  { const p = loadIcons(); ICONS = p; p.then((v) => { p.v = v; }); await p.catch(() => {}); }
  try { await api('GET', 'stats'); } catch (e) { $('#loginErr').textContent = KEY ? e.message : ''; return false; }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); route(); return true;
}
function signOut() { if (typeof liveStop === 'function') liveStop(); if (KEY) fetch('/api/admin/logout', { method: 'POST', headers: { 'x-admin-token': KEY } }).catch(() => {}); KEY = ''; sessionStorage.removeItem('adminToken'); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); closeSheet(); }
$('#loginForm').onsubmit = async (e) => {
  e.preventDefault(); $('#loginErr').textContent = '';
  const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ user: $('#user').value, pass: $('#key').value }) });
  const j = await r.json().catch(() => ({ error: 'Server did not answer with JSON' }));
  if (!r.ok) { $('#loginErr').textContent = j.error; return; }
  KEY = j.token; sessionStorage.setItem('adminToken', KEY); $('#key').value = ''; enter();
};
$('#signOut').onclick = signOut;

// ---- router: #/overview  #/players  #/players/12  #/leaderboard  #/log
function route() {
  if (!KEY) return;
  const [, tab = 'overview', id] = location.hash.split('/');
  document.querySelectorAll('nav a').forEach((a) => a.classList.toggle('on', a.dataset.t === tab));
  liveStop();
  ({ overview, players, live, leaderboard, ratings, log: logView }[tab] || overview)();
  if (tab === 'players' && id) openPlayer(+id); else closeSheet(true);
}
window.addEventListener('hashchange', route);
const go = (h) => { location.hash = h; };

// ---- Overview
async function overview() {
  const m = $('#main'); m.innerHTML = '<h2>Overview</h2><p class="sub">How your server is doing.</p><div class="empty">Loading…</div>';
  try {
    const s = await api('GET', 'stats');
    const max = Math.max(1, ...s.perDay.map((d) => d.n));
    const stat = (n, label, h) => `<button class="stat" ${h ? `onclick="go('${h}')"` : 'disabled'}><b>${fmt(n)}</b><span>${label}</span></button>`;
    m.innerHTML = `<h2>Overview</h2><p class="sub">How your server is doing.</p>
      <div class="grid">${stat(s.users, 'Players', '#/players')}${stat(s.today, 'New in 24 h', '#/players')}${stat(s.sessions, 'Signed-in devices')}${stat(s.banned, 'Banned', '#/players?banned')}${stat(s.scores, 'On leaderboard', '#/leaderboard')}${stat(s.saves, 'Cloud saves')}${stat(s.referred, 'Joined via referral')}</div>
      <div class="cols">
        <div class="card"><h3>New players, last 14 days</h3>${s.perDay.length ? `<div class="bars">${s.perDay.map((d) => `<div style="height:${Math.max(4, d.n / max * 100)}%" title="${d.d}: ${d.n}"><i>${d.n}</i></div>`).join('')}</div>` : '<div class="empty">No sign-ups yet</div>'}</div>
        <div class="card"><h3>Newest players</h3>${s.recent.length ? s.recent.map((u) => `<button class="row" onclick="go('#/players/${u.id}')">${avatar(u.name, u.icon)}<div class="grow"><div class="nm">${esc(u.name)}</div><div class="mute">joined ${ago(u.created_at)}</div></div>${u.banned ? '<span class="badge bad">Banned</span>' : ''}</button>`).join('') : '<div class="empty">Nobody yet</div>'}</div>
        <div class="card"><h3>Recent actions</h3>${s.log.length ? s.log.map((l) => `<div class="row"><div class="grow"><div class="nm">${esc(l.action)} · ${esc(l.target_name || '')}</div><div class="mute">${esc(l.detail || '')} ${ago(l.at)}</div></div></div>`).join('') : '<div class="empty">Nothing yet</div>'}</div>
      </div>`;
  } catch (e) { fail(e); }
}

// ---- Players
let pl = { q: '', filter: 'all', users: [], more: false };
async function players() {
  if (location.hash.includes('?banned')) pl.filter = 'banned';
  const m = $('#main');
  m.innerHTML = `<h2>Players</h2><p class="sub">Search by name, ID or referral code. Click a player to manage them.</p>
    <div class="bar"><input id="q" class="search" placeholder="Search players…   (press / to focus)" value="${esc(pl.q)}" autocomplete="off">
      <button class="chip ${pl.filter === 'all' ? 'on' : ''}" data-f="all">All</button><button class="chip ${pl.filter === 'banned' ? 'on' : ''}" data-f="banned">Banned</button></div>
    <div class="card" id="plist"></div><div id="more" style="margin-top:12px"></div>`;
  let t; $('#q').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { pl.q = e.target.value; load(true); }, 250); };
  m.querySelectorAll('.chip').forEach((c) => c.onclick = () => { pl.filter = c.dataset.f; players(); });
  load(true);
  async function load(reset) {
    try {
      const j = await api('GET', `users?q=${encodeURIComponent(pl.q)}&filter=${pl.filter}&offset=${reset ? 0 : pl.users.length}`);
      pl.users = reset ? j.users : pl.users.concat(j.users); pl.more = j.more;
      $('#plist').innerHTML = pl.users.length ? pl.users.map((u) => `<button class="row" onclick="go('#/players/${u.id}')">${avatar(u.name, u.icon)}<div class="grow"><div class="nm">${esc(u.name)} <span class="mute">#${u.id}</span></div><div class="mute">joined ${ago(u.created_at)}${u.best_level ? ` · level ${u.best_level} · ${fmt(u.best_score)} pts` : ' · no scores yet'}</div></div>${u.banned ? '<span class="badge bad">Banned</span>' : ''}</button>`).join('') : '<div class="empty">No players match.</div>';
      $('#more').innerHTML = pl.more ? '<button class="btn" id="moreBtn">Load more</button>' : '';
      if (pl.more) $('#moreBtn').onclick = () => load(false);
    } catch (e) { fail(e); }
  }
}

// ---- Player sheet (everything you can do to one player)
let openId = null;
function closeSheet(silent) { $('#sheetWrap').classList.add('hidden'); openId = null; if (!silent && location.hash.startsWith('#/players/')) history.replaceState(null, '', '#/players'); }
$('#sheetWrap').onclick = (e) => { if (e.target.id === 'sheetWrap') closeSheet(); };
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#sheetWrap').classList.contains('hidden') && $('#dlgWrap').classList.contains('hidden')) closeSheet();
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && KEY) { e.preventDefault(); if (!$('#q')) go('#/players'); setTimeout(() => $('#q') && $('#q').focus(), 50); }
});

async function openPlayer(id) {
  openId = id; const sh = $('#sheet'); $('#sheetWrap').classList.remove('hidden');
  sh.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const d = await api('GET', 'user?id=' + id); if (openId !== id) return;
    const u = d.user, s = d.score, sv = d.save;
    const act = (a, extra = {}) => api('POST', 'action', { id, action: a, ...extra }).then(() => { openPlayer(id); if (location.hash.startsWith('#/players')) players(); }).catch(fail);
    sh.innerHTML = `<header>${avatar(u.name, sv && sv.icon || (s && s.icon), "big")}<div><h3>${esc(u.name)}</h3><div class="mute">Player #${u.id} · joined ${when(u.created_at)}</div></div><button class="close" id="x" aria-label="Close">✕</button></header>
      ${u.banned ? `<div class="banned-note"><b>Banned.</b> ${esc(u.ban_reason || 'No reason given.')}</div>` : ''}
      <div class="info">
        <div><small>Boomling</small>${icon(sv && sv.icon || (s && s.icon))} ${esc(iconTitle(sv && sv.icon || (s && s.icon)) || "—")}</div><div><small>Best level</small>${s ? s.best_level : '—'}</div><div><small>Best score</small>${s ? fmt(s.best_score) : '—'}</div>
        <div><small>Rank</small>${s ? s.rank : (sv && sv.rank) || '—'}</div><div><small>Signed-in devices</small>${d.sessions}</div>
        <div><small>Gold in cloud save</small>${sv && !sv.broken ? fmt(sv.gold) : '—'}</div><div><small>Games played</small>${sv && sv.games ? fmt(sv.games) : '—'}</div>
        <div><small>Referral code</small><b>${esc(u.ref_code)}</b></div><div><small>Referral gold earned</small>${fmt(u.earned_gold)}</div>
        <div style="grid-column:1/-1"><small>Referred by</small>${d.referredBy ? `<a class="link" onclick="go('#/players/${d.referredBy.id}')">${esc(d.referredBy.name)}</a>` : 'nobody'} · recruited ${d.referrals.length ? d.referrals.map((r) => `<a class="link" onclick="go('#/players/${r.id}')">${esc(r.name)}</a>`).join(', ') : 'nobody'}</div>
        ${sv ? `<div style="grid-column:1/-1"><small>Cloud save</small>last synced ${ago(sv.updatedAt)}</div>` : ''}
      </div>
      <div class="sec"><h4>Take coins away</h4><div class="act"><input class="f" id="takeAmt" type="number" min="1" placeholder="Coins to remove"><button class="btn danger" id="takeBtn">Take coins</button><button class="btn danger" id="wipeBtn">Set to 0</button></div><div class="mute">${u.take_gold || u.wipe_gold ? `<b style="color:var(--warn)">Waiting for their next login:</b> ${u.wipe_gold ? 'set coins to 0' : 'remove ' + fmt(u.take_gold) + ' coins'}.` : 'Removed from their game the next time they open it (their cloud save changes right away).'}</div></div>
      <div class="sec"><h4>Give</h4><div class="act"><input class="f" id="gold" type="number" min="1" max="1000000" placeholder="Gold amount"><button class="btn primary" id="giveBtn">Gift gold</button></div><div class="mute">Gold shows up the next time they open the game.</div></div>
      <div class="sec"><h4>Free gold packs</h4><div class="act"><button class="btn" id="iapBtn">Reset 3-day timer</button></div><div class="mute">${u.last_iap ? 'Last free pack: ' + when(u.last_iap) : 'Has not taken a free pack yet.'}</div></div>
      <div class="sec"><h4>Account</h4><div class="act"><button class="btn" id="renameBtn">Rename</button><button class="btn" id="pwBtn">Reset password</button><button class="btn" id="kickBtn">Sign out devices</button></div></div>
      <div class="sec"><h4>Moderation</h4><div class="act">${u.banned ? '<button class="btn primary" id="unbanBtn">Unban player</button>' : '<button class="btn danger" id="banBtn">Ban player</button>'}<button class="btn" id="scoreBtn">Remove from leaderboard</button><button class="btn" id="saveBtn">Delete cloud save</button></div></div>
      <div class="sec"><h4>Danger zone</h4><button class="btn danger" id="delBtn">Delete account…</button></div>`;
    $('#x').onclick = () => closeSheet();
    $('#giveBtn').onclick = () => { const g = +$('#gold').value; if (g >= 1) act('grant', { gold: g }).then(() => toast('Gold gifted')); else toast('Enter an amount first'); };
    $('#takeBtn').onclick = async () => { const n = +$('#takeAmt').value; if (!(n >= 1)) return toast('Enter an amount first'); if (await dialog({ title: 'Take ' + fmt(n) + ' coins from ' + u.name + '?', text: 'They lose these coins from their game and cloud save.', ok: 'Take coins', danger: true })) act('takeGold', { gold: n }).then(() => toast('Coins removed')); };
    $('#wipeBtn').onclick = async () => { if (await dialog({ title: 'Set ' + u.name + "'s coins to 0?", text: 'Their coin balance becomes 0 the next time they open the game.', ok: 'Set to 0', danger: true })) act('wipeGold').then(() => toast('Coins cleared')); };
    $('#iapBtn').onclick = () => act('resetIap').then(() => toast('Timer reset'));
    $('#renameBtn').onclick = async () => { const v = await dialog({ title: 'Rename player', fields: [{ label: 'New name (3–12 letters, numbers, space, _ -)', value: u.name }], ok: 'Rename' }); if (v) act('rename', { name: v[0] }); };
    $('#pwBtn').onclick = async () => { const v = await dialog({ title: 'Reset password', text: 'They will be signed out everywhere and need this new password.', fields: [{ label: 'New password (6+ characters)', type: 'text' }], ok: 'Reset' }); if (v) act('resetpw', { password: v[0] }).then(() => toast('Password reset')); };
    $('#kickBtn').onclick = () => act('kick').then(() => toast('Signed out'));
    if ($('#banBtn')) $('#banBtn').onclick = async () => { const v = await dialog({ title: 'Ban ' + u.name + '?', text: 'They are signed out, cannot log in, and disappear from the leaderboard.', fields: [{ label: 'Reason (shown to them when they try to log in)', placeholder: 'optional' }], ok: 'Ban', danger: true }); if (v) act('ban', { reason: v[0] }).then(() => toast('Banned')); };
    if ($('#unbanBtn')) $('#unbanBtn').onclick = () => act('unban').then(() => toast('Unbanned'));
    $('#scoreBtn').onclick = async () => { if (await dialog({ title: 'Remove from leaderboard?', text: 'Their best score and level are deleted. Their next game submits a fresh one.', ok: 'Remove', danger: true })) act('clearScore'); };
    $('#saveBtn').onclick = async () => { if (await dialog({ title: 'Delete cloud save?', text: 'Their save is removed from the server. Their device keeps its own copy.', ok: 'Delete', danger: true })) act('clearSave'); };
    $('#delBtn').onclick = async () => { const v = await dialog({ title: 'Delete ' + u.name + '?', text: 'This permanently removes the account, save and score. Type the name to confirm.', fields: [{ label: 'Type "' + u.name + '"' }], ok: 'Delete forever', danger: true }); if (v && v[0] === u.name) { await api('POST', 'action', { id, action: 'delete' }).then(() => { toast('Account deleted'); closeSheet(); go('#/players'); }).catch(fail); } else if (v) toast('Name did not match'); };
  } catch (e) { closeSheet(); fail(e); }
}

// ---- Live view + pranks: who is in the game right now, a snapshot of their screen, and one-tap harmless pranks
let liveTimer = null, liveSel = null, liveAll = false;
const PRANKS = [
  ['flip', '🙃', 'Upside down', 'Screen flipped 180° (taps still work)', 12], ['mirror', '🪞', 'Mirror', 'Left and right swapped', 12],
  ['wobble', '🌊', 'Wobble', 'Screen sways like a boat', 12], ['rainbow', '🌈', 'Rainbow', 'Colours cycle wildly', 12],
  ['invert', '🔄', 'Inverted', 'Negative colours', 10], ['gray', '🩶', 'Grayscale', 'Old black and white TV', 12],
  ['sepia', '📜', 'Old photo', 'Sepia and saturation', 12], ['blur', '😵', 'Blurry', 'Needs glasses', 10],
  ['tiny', '🔬', 'Tiny game', 'Shrunk to half size', 12], ['zoomies', '⚡', 'Zoomies', 'Super saturated', 10],
  ['sound', '🔔', 'Sound spam', 'Plays random game sounds', 8], ['fakegold', '🤑', 'Fake jackpot', '"+1,000,000 gold" ... just kidding', 0],
  ['toast', '🏆', 'Fake achievement', 'Pops an achievement banner', 0], ['message', '💬', 'Send message', 'Pop-up dialog with your text', 0],
];
let liveWS = null, liveClosing = false, liveFrames = 0;
function liveStop() { liveClosing = true; clearInterval(liveTimer); if (liveWS) { try { liveWS.close(); } catch (e) { /* ignore */ } liveWS = null; } }
async function live() {
  const m = $('#main');
  m.innerHTML = '<h2>Live &amp; Pranks</h2><p class="sub">A real-time view of everyone in the game right now. Pick a player to watch their screen live (about 4 frames a second), then play a harmless, time-limited prank. Nothing touches their save.</p><div class="live"><div class="card" id="lvList"><h3>Online now</h3><div class="empty">Connecting…</div></div><div class="card" id="lvView"><div class="empty">Pick a player on the left.</div></div></div>';
  const players = new Map();   // id -> { id, name, state }
  let status = 'Connecting…';
  const list = () => {
    if (!$('#lvList')) return;
    const arr = [...players.values()];
    $('#lvList').innerHTML = '<h3>Online now <span class="badge">' + arr.length + '</span> <span class="mute" style="font-weight:500">' + esc(status) + '</span></h3>' + (arr.length ? arr.map((p) => `<button class="pl ${p.id === liveSel ? 'on' : ''}" data-id="${p.id}">${avatar(p.name, p.state.icon)}<div class="grow"><div class="nm"><span class="dot"></span>${esc(p.name)}</div><div class="mute">${esc(p.state.screen || '?')}${p.state.score ? ' · ' + fmt(p.state.score) + ' pts' : ''}</div></div></button>`).join('') : '<div class="empty">Nobody is playing right now.<br>Players show up here the moment they open the game while signed in.</div>');
    $('#lvList').querySelectorAll('.pl').forEach((b) => b.onclick = () => select(+b.dataset.id));
  };
  const info = (p) => `<div style="grid-column:1/-1"><small>Boomling</small>${icon(p.state.icon)} ${esc(iconTitle(p.state.icon) || '—')}</div><div><small>Screen</small>${esc(p.state.screen || '?')}</div><div><small>Score</small>${fmt(p.state.score)}</div><div><small>Level</small>${p.state.level || '—'}</div><div><small>Rank</small>${p.state.rank || '—'}</div><div><small>Gold</small>${fmt(p.state.gold)}</div><div><small>Active pranks</small>${(p.state.effects || []).join(', ') || 'none'}</div>`;
  const view = () => {
    const v = $('#lvView'); if (!v) return; const p = players.get(liveSel);
    if (!p && !liveAll) { v.innerHTML = '<div class="empty">Pick a player on the left.</div>'; return; }
    const head = liveAll ? `<h3>Everyone online (${players.size})</h3>` : `<h3>${esc(p.name)} <span class="badge" id="lvLive">LIVE</span> <a class="link mute" onclick="go('#/players/${p.id}')">open profile</a></h3>`;
    const body = liveAll ? '' : `<div class="screen"><img id="lvImg" alt="Live screen"><div class="kv" id="lvInfo">${info(p)}</div></div>`;
    v.innerHTML = head + `<div class="tgt"><button class="chip ${liveAll ? 'on' : ''}" id="allBtn">🎉 Prank everyone online</button></div>` + body + `<div class="pranks">${PRANKS.map((q) => `<button class="btn" data-k="${q[0]}"><span>${q[1]}</span>${q[2]}<small>${q[3]}</small></button>`).join('')}</div>`;
    const img = $('#lvImg'); if (img && p.frame) img.src = p.frame;
    $('#allBtn').onclick = () => { liveAll = !liveAll; if (liveAll) select(0); else view(); };
    v.querySelectorAll('.pranks .btn').forEach((b) => b.onclick = async () => {
      const q = PRANKS.find((x) => x[0] === b.dataset.k), msg = { t: 'prank', id: liveAll ? 'all' : liveSel, type: q[0], secs: q[4] };
      if (q[0] === 'message') { const r = await dialog({ title: 'Send a pop-up', fields: [{ label: 'Title (40 max)', value: 'Hello!' }, { label: 'Message (140 max)', value: 'I can see you...' }], ok: 'Send it' }); if (!r) return; msg.text = r[0]; msg.text2 = r[1]; }
      if (q[0] === 'toast') { const r = await dialog({ title: 'Fake achievement', fields: [{ label: 'Title', value: 'Achievement unlocked!' }, { label: 'Subtitle', value: 'Stared at the screen' }], ok: 'Send it' }); if (!r) return; msg.text = r[0]; msg.text2 = r[1]; }
      if (liveWS && liveWS.readyState === 1) liveWS.send(JSON.stringify(msg)); else toast('Not connected');
    });
  };
  const select = (id) => { liveSel = id; if (id) liveAll = false; if (liveWS && liveWS.readyState === 1) liveWS.send(JSON.stringify({ t: 'watch', id })); list(); view(); };
  const open = () => {
    if (liveClosing) return;
    const ws = liveWS = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/admin/ws', [KEY]);
    ws.onopen = () => { status = 'live'; list(); if (liveSel) ws.send(JSON.stringify({ t: 'watch', id: liveSel })); };
    ws.onmessage = (ev) => {
      let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (d.t === 'list') { players.clear(); d.players.forEach((p) => players.set(p.id, p)); list(); view(); }
      else if (d.t === 'join') { players.set(d.id, d); list(); }
      else if (d.t === 'leave') { players.delete(d.id); if (liveSel === d.id) liveSel = null; list(); view(); }
      else if (d.t === 'state') { const p = players.get(d.id) || { id: d.id, name: d.name }; p.state = d.state; players.set(d.id, p); const el = $('#lvInfo'); if (d.id === liveSel && el) el.innerHTML = info(p); list(); }
      else if (d.t === 'frame') { const p = players.get(d.id); if (p) p.frame = d.d; const img = $('#lvImg'); if (d.id === liveSel && img) img.src = d.d; }
      else if (d.t === 'sent') toast(d.n ? 'Sent to ' + d.n + (d.n === 1 ? ' player 😈' : ' players 😈') : 'Nobody is online');
    };
    ws.onclose = () => { if (liveClosing) return; status = 'reconnecting…'; players.clear(); list(); setTimeout(open, 1500); };
  };
  liveClosing = false; open();
}

// ---- Leaderboard
async function leaderboard() {
  const m = $('#main'); m.innerHTML = '<h2>Leaderboard</h2><p class="sub">Ordered like the game: highest level first, then score. Click a name to manage that player.</p><div class="card" id="lb"><div class="empty">Loading…</div></div>';
  try {
    const { entries } = await api('GET', 'scores');
    $('#lb').innerHTML = entries.length ? `<table><tr><th>#</th><th></th><th>Player</th><th class="num">Level</th><th class="num">Score</th><th></th></tr>${entries.map((e, i) => `<tr><td>${i + 1}</td><td>${icon(e.icon)}</td><td><a class="link" onclick="go('#/players/${e.id}')">${esc(e.name)}</a> ${e.banned ? '<span class="badge bad">Banned</span>' : ''}</td><td class="num">${e.level}</td><td class="num">${fmt(e.score)}</td><td class="num"><button class="btn danger" onclick="rmScore(${e.id},'${esc(e.name).replace(/'/g, '')}')">Remove</button></td></tr>`).join('')}</table>` : '<div class="empty">No scores yet.</div>';
  } catch (e) { fail(e); }
}
async function rmScore(id, name) { if (await dialog({ title: 'Remove ' + name + ' from the leaderboard?', text: 'Their best score is deleted.', ok: 'Remove', danger: true })) api('POST', 'action', { id, action: 'clearScore' }).then(() => { toast('Removed'); leaderboard(); }).catch(fail); }

// ---- Reviews from the public /rate/ page
async function ratings() {
  const m = $('#main'); m.innerHTML = '<h2>Reviews</h2><p class="sub">What people wrote on your public rating page (<a class="link" href="/rate/" target="_blank">/rate/</a>).</p><div class="card" id="rv"><div class="empty">Loading…</div></div>';
  try {
    const j = await api('GET', 'ratings');
    $('#rv').innerHTML = `<h3>${j.count} review${j.count === 1 ? '' : 's'} · average ${j.average || '—'} ★</h3>` + (j.ratings.length ? j.ratings.map((r) => `<div class="row"><div class="grow"><div class="nm">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)} <span class="mute">${esc(r.name || 'Anonymous')} · ${ago(r.at)}</span></div>${r.comment ? `<div>${esc(r.comment)}</div>` : ''}</div><button class="btn danger" data-id="${r.id}">Delete</button></div>`).join('') : '<div class="empty">No reviews yet.</div>');
    $('#rv').querySelectorAll('button[data-id]').forEach((b) => b.onclick = async () => { if (await dialog({ title: 'Delete this review?', ok: 'Delete', danger: true })) api('POST', 'deleteRating', { id: +b.dataset.id }).then(() => { toast('Deleted'); ratings(); }).catch(fail); });
  } catch (e) { fail(e); }
}

// ---- Activity log
async function logView() {
  const m = $('#main'); m.innerHTML = '<h2>Activity</h2><p class="sub">Everything done from this admin site, newest first.</p><div class="card" id="lg"><div class="empty">Loading…</div></div>';
  try {
    const { log } = await api('GET', 'log');
    $('#lg').innerHTML = log.length ? log.map((l) => `<div class="row"><div class="grow"><div class="nm">${esc(l.action)} — ${l.target_id ? `<a class="link" onclick="go('#/players/${l.target_id}')">${esc(l.target_name)}</a>` : esc(l.target_name || '')}</div><div class="mute">${esc(l.detail || '')}</div></div><div class="mute" title="${when(l.at)}">${ago(l.at)}</div></div>`).join('') : '<div class="empty">No actions yet.</div>';
  } catch (e) { fail(e); }
}

if (KEY) enter();
</script>
