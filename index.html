<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boomlings">
<meta name="format-detection" content="telephone=no">
<title>Boomlings</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  html { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; }   /* no pull-to-refresh / rubber-banding on phones */
  @supports (height: 100dvh) { html, body { height: 100dvh; } }   /* the visible height, not the height behind the URL bar */
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }   /* the game sits dead centre in the visible screen */
  @media (pointer: coarse) { html, body, body #game { background: #000; } #rotate { background: #000; } }   /* phones and tablets: pure black borders around the game */
  #game { display: block; margin: auto; flex: none; image-rendering: auto; background: #0b1020; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; }
  /* phones held sideways: the game is a tall portrait layout, ask to turn the phone (the game pauses itself behind this) */
  #rotate { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; background: #0b1020; color: #ffd84a; font: 700 22px/1.4 sans-serif; text-align: center; align-items: center; justify-content: center; padding: 24px; }
  @media (orientation: landscape) and (max-height: 520px) and (pointer: coarse) { #rotate { display: flex; } }
  #loading { position: absolute; color: #ffd84a; font: 18px/1.4 sans-serif; text-align: center; }
</style>
</head>
<body>
<div id="rotate">Turn your phone upright<br>to play Boomlings</div>
<div id="loading">Loading Boomlings…</div>
<canvas id="game" width="640" height="1066"></canvas>
<script>
  // no right-click menu (so "Save image as…" is not offered on the game) and no dragging the canvas out
  addEventListener('contextmenu', function (e) { e.preventDefault(); });
  addEventListener('dragstart', function (e) { e.preventDefault(); });
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
