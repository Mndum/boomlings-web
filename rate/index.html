<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rate Boomlings</title>
<meta name="description" content="Rate this browser port of Boomlings and leave a review.">
<style>
  :root { --bg:#0b3a86; --bg2:#06255a; --card:#fff; --ink:#18202f; --mute:#667085; --line:#e3e8f2; --gold:#ffc41a; --gold2:#ff9d00; --brand:#1b78e0; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body { background:radial-gradient(ellipse at 50% -10%, #2a78d6 0%, var(--bg) 45%, var(--bg2) 100%) fixed; color:var(--ink); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; padding:24px 16px 56px; }
  main { max-width:560px; margin:0 auto; }
  header { text-align:center; color:#fff; margin:8px 0 22px; }
  header h1 { margin:0; font-size:clamp(30px,8vw,44px); letter-spacing:.5px; color:var(--gold); text-shadow:0 3px 0 #a85a00, 0 6px 14px rgba(0,0,0,.35); }
  header p { margin:6px 0 0; opacity:.9; }
  .card { background:var(--card); border-radius:18px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.28); margin-bottom:16px; }
  .sum { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .big { text-align:center; min-width:96px; }
  .big b { font-size:48px; line-height:1; display:block; }
  .big span { color:var(--mute); font-size:13px; }
  .bars { flex:1; min-width:180px; }
  .bar { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--mute); margin:3px 0; }
  .bar i { flex:1; height:9px; background:var(--line); border-radius:99px; overflow:hidden; }
  .bar i u { display:block; height:100%; background:linear-gradient(var(--gold),var(--gold2)); }
  h2 { margin:0 0 12px; font-size:20px; }
  .stars { display:flex; gap:6px; justify-content:center; margin:6px 0 14px; }
  .stars button { background:none; border:0; padding:0; font-size:46px; line-height:1; color:#cfd6e4; cursor:pointer; transition:transform .12s; }
  .stars button.on { color:var(--gold); text-shadow:0 2px 0 #c97a00; }
  .stars button:hover { transform:scale(1.15); }
  label { display:block; font-weight:600; font-size:14px; margin:12px 0 4px; }
  input,textarea { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; background:#f7f9fd; color:var(--ink); }
  textarea { min-height:96px; resize:vertical; }
  .go { width:100%; margin-top:16px; padding:14px; border:0; border-radius:12px; font:700 18px/1 inherit; color:#5a3000; background:linear-gradient(#ffd84a,#ffa300); box-shadow:0 4px 0 #b86a00; cursor:pointer; }
  .go:active { transform:translateY(3px); box-shadow:0 1px 0 #b86a00; }
  .go:disabled { opacity:.55; cursor:default; }
  .msg { text-align:center; margin-top:12px; font-weight:600; min-height:1.4em; }
  .msg.ok { color:#12a150; } .msg.err { color:#d92d20; }
  .rev { padding:12px 0; border-top:1px solid var(--line); }
  .rev:first-of-type { border-top:0; }
  .rev .s { color:var(--gold2); letter-spacing:1px; }
  .rev .w { color:var(--mute); font-size:13px; }
  .rev p { margin:4px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .empty { color:var(--mute); text-align:center; padding:8px 0; }
  .play { display:block; text-align:center; color:#fff; font-weight:700; margin-top:6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Rate Boomlings</h1>
    <p>Tell me what you think of this browser port!</p>
  </header>

  <section class="card">
    <div class="sum">
      <div class="big"><b id="avg">–</b><span id="cnt">no reviews yet</span></div>
      <div class="bars" id="bars"></div>
    </div>
  </section>

  <section class="card">
    <h2 id="formTitle">Your rating</h2>
    <div class="stars" id="stars" role="radiogroup" aria-label="Stars"></div>
    <label for="name">Name (optional)</label>
    <input id="name" maxlength="20" placeholder="Anonymous" autocomplete="nickname">
    <label for="text">Review (optional)</label>
    <textarea id="text" maxlength="500" placeholder="What do you like? What should be better?"></textarea>
    <button class="go" id="send" disabled>Send my rating</button>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card">
    <h2>What people say</h2>
    <div id="revs"><div class="empty">Loading…</div></div>
  </section>

  <a class="play" href="/">← Back to the game</a>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = (t) => { const s = Math.floor(Date.now() / 1000 - t); if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; if (s < 86400 * 30) return Math.floor(s / 86400) + ' d ago'; return new Date(t * 1000).toLocaleDateString(); };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };

// one review per browser: a random id, remembered so a second visit edits the first review
let cid = store.get('boomlings.rate.cid');
if (!/^[a-f0-9]{32}$/.test(cid || '')) { cid = [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, '0')).join(''); store.set('boomlings.rate.cid', cid); }
let stars = +store.get('boomlings.rate.stars') || 0;
$('#name').value = store.get('boomlings.rate.name') || '';
$('#text').value = store.get('boomlings.rate.text') || '';
if (stars) $('#formTitle').textContent = 'Your rating (you can change it)';

function drawStars() {
  $('#stars').innerHTML = [1, 2, 3, 4, 5].map((n) => `<button type="button" class="${n <= stars ? 'on' : ''}" data-n="${n}" role="radio" aria-checked="${n === stars}" aria-label="${n} star${n > 1 ? 's' : ''}">★</button>`).join('');
  $('#stars').querySelectorAll('button').forEach((b) => b.onclick = () => { stars = +b.dataset.n; drawStars(); });
  $('#send').disabled = !stars;
}
drawStars();

async function load() {
  try {
    const j = await (await fetch('/api/ratings')).json();
    $('#avg').textContent = j.count ? j.average.toFixed(1) : '–';
    $('#cnt').textContent = j.count ? j.count + (j.count === 1 ? ' review' : ' reviews') : 'no reviews yet';
    const max = Math.max(1, ...j.distribution);
    $('#bars').innerHTML = [5, 4, 3, 2, 1].map((n) => `<div class="bar"><span>${n}★</span><i><u style="width:${j.distribution[n - 1] / max * 100}%"></u></i><span>${j.distribution[n - 1]}</span></div>`).join('');
    $('#revs').innerHTML = j.reviews.length ? j.reviews.map((r) => `<div class="rev"><div><span class="s">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span> <span class="w">${esc(r.name || 'Anonymous')} · ${ago(r.at)}</span></div><p>${esc(r.comment)}</p></div>`).join('') : '<div class="empty">No written reviews yet. Be the first!</div>';
  } catch (e) { $('#revs').innerHTML = '<div class="empty">Could not load reviews.</div>'; }
}
load();

$('#send').onclick = async () => {
  const msg = $('#msg'); msg.className = 'msg'; msg.textContent = ''; $('#send').disabled = true;
  try {
    const r = await fetch('/api/rate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ cid, stars, name: $('#name').value, comment: $('#text').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Something went wrong');
    store.set('boomlings.rate.stars', stars); store.set('boomlings.rate.name', $('#name').value); store.set('boomlings.rate.text', $('#text').value);
    msg.className = 'msg ok'; msg.textContent = 'Thank you! Your rating was saved. 💛'; $('#formTitle').textContent = 'Your rating (you can change it)'; load();
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
  $('#send').disabled = !stars;
};
</script>
</body>
</html>
