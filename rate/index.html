<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rate Boomlings</title>
<meta name="description" content="Rate this fan-made browser port of Boomlings and leave feedback.">
<style>
  :root { --bg:#0d1b33; --card:#14264a; --line:#243a66; --ink:#eef3fb; --mute:#9db0cf; --star:#f5b301; --brand:#2f7fe6; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body { background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding:28px 16px 56px; }
  main { max-width:520px; margin:0 auto; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  header img { height:44px; width:auto; }
  h1 { font-size:22px; margin:0; font-weight:700; }
  .lead { color:var(--mute); margin:6px 0 22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 12px; font-weight:650; color:var(--mute); text-transform:uppercase; letter-spacing:.05em; }

  .sum { display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  .big { text-align:center; min-width:90px; }
  .big b { display:block; font-size:44px; line-height:1; font-weight:700; }
  .big .st { color:var(--star); letter-spacing:2px; margin:4px 0 2px; }
  .big small { color:var(--mute); }
  .bars { flex:1; min-width:180px; }
  .bar { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--mute); margin:3px 0; }
  .bar b { width:12px; color:var(--ink); font-weight:600; }
  .bar i { flex:1; height:8px; background:var(--line); border-radius:99px; overflow:hidden; }
  .bar u { display:block; height:100%; background:var(--star); }
  .bar span { width:24px; text-align:right; }

  .stars { display:flex; gap:4px; margin:0 0 14px; }
  .stars button { background:none; border:0; padding:0 2px; font-size:40px; line-height:1; color:#3a4f7a; cursor:pointer; }
  .stars button.on { color:var(--star); }
  .stars button:hover { color:var(--star); }
  label { display:block; font-size:14px; color:var(--mute); margin:12px 0 4px; }
  input,textarea { width:100%; padding:10px 12px; font:inherit; color:var(--ink); background:#0d1b33; border:1px solid var(--line); border-radius:8px; outline:0; }
  input:focus,textarea:focus { border-color:var(--brand); }
  textarea { min-height:90px; resize:vertical; }
  button.send { margin-top:16px; padding:11px 20px; font:inherit; font-weight:650; color:#fff; background:var(--brand); border:0; border-radius:8px; cursor:pointer; }
  button.send:hover { filter:brightness(1.1); }
  button.send:disabled { background:#34486f; color:#8fa1c2; cursor:default; filter:none; }
  .msg { display:inline-block; margin-left:12px; font-size:14px; }
  .msg.ok { color:#5fd38d; } .msg.err { color:#ff8a80; }

  .rev { padding:12px 0; border-top:1px solid var(--line); }
  .rev:first-of-type { border-top:0; padding-top:0; }
  .rev .s { color:var(--star); letter-spacing:1px; }
  .rev .w { color:var(--mute); font-size:13px; }
  .rev p { margin:4px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .empty { color:var(--mute); }
  footer { color:var(--mute); font-size:13px; margin-top:8px; }
  footer a { color:var(--brand); }
</style>
</head>
<body>
<main>
  <header><img id="logo" alt="Boomlings"><h1>Rate this port</h1></header>
  <p class="lead">A fan-made browser version of Boomlings. Let me know how it plays and what could be better.</p>

  <section class="card">
    <div class="sum">
      <div class="big"><b id="avg">–</b><div class="st" id="miniStars"></div><small id="cnt">no reviews yet</small></div>
      <div class="bars" id="bars"></div>
    </div>
  </section>

  <section class="card">
    <h2 id="formTitle">Your rating</h2>
    <div class="stars" id="stars" role="radiogroup" aria-label="Stars"></div>
    <label for="name">Name (optional)</label>
    <input id="name" maxlength="20" placeholder="Anonymous" autocomplete="nickname">
    <label for="text">Comment (optional)</label>
    <textarea id="text" maxlength="500"></textarea>
    <button class="send" id="send" disabled>Submit</button><span class="msg" id="msg"></span>
  </section>

  <section class="card">
    <h2>Reviews</h2>
    <div id="revs"><div class="empty">Loading…</div></div>
  </section>

  <footer><a href="/">← Back to the game</a><br>Boomlings is made by RobTop Games. This is an unofficial fan port and is not affiliated with them.</footer>
</main>

<script type="module">
import { Atlas } from '/js/atlas.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = (t) => { const s = Math.floor(Date.now() / 1000 - t); if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; if (s < 86400 * 30) return Math.floor(s / 86400) + ' d ago'; return new Date(t * 1000).toLocaleDateString(); };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };
const starTxt = (n) => '★'.repeat(n) + '☆'.repeat(5 - n);

// just the game's logo, small; the rest is plain
try {
  const menu = await Atlas.load('/assets/menuSheet-hd'), f = menu.frames['boomlingslogo.png'], c = document.createElement('canvas');
  c.width = f.sw; c.height = f.sh; menu.draw(c.getContext('2d'), 'boomlingslogo.png', f.sw / 2, f.sh / 2); $('#logo').src = c.toDataURL();
} catch (e) { $('#logo').remove(); }

// one review per browser: a random id, remembered so a second visit edits the first review
let cid = store.get('boomlings.rate.cid');
if (!/^[a-f0-9]{32}$/.test(cid || '')) { cid = [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, '0')).join(''); store.set('boomlings.rate.cid', cid); }
let stars = +store.get('boomlings.rate.stars') || 0;
$('#name').value = store.get('boomlings.rate.name') || '';
$('#text').value = store.get('boomlings.rate.text') || '';
if (stars) $('#formTitle').textContent = 'Your rating (you can change it)';

function drawStars() {
  $('#stars').innerHTML = [1, 2, 3, 4, 5].map((n) => `<button type="button" class="${n <= stars ? 'on' : ''}" data-n="${n}" role="radio" aria-checked="${n === stars}" aria-label="${n} star${n > 1 ? 's' : ''}">★</button>`).join('');
  $('#stars').querySelectorAll('button').forEach((b) => b.onclick = () => { stars = +b.dataset.n; drawStars(); });
  $('#send').disabled = !stars;
}
drawStars();

async function load() {
  try {
    const j = await (await fetch('/api/ratings')).json();
    $('#avg').textContent = j.count ? j.average.toFixed(1) : '–';
    $('#miniStars').textContent = starTxt(Math.round(j.average));
    $('#cnt').textContent = j.count ? j.count + (j.count === 1 ? ' review' : ' reviews') : 'no reviews yet';
    const max = Math.max(1, ...j.distribution);
    $('#bars').innerHTML = [5, 4, 3, 2, 1].map((n) => `<div class="bar"><b>${n}</b><i><u style="width:${j.distribution[n - 1] / max * 100}%"></u></i><span>${j.distribution[n - 1]}</span></div>`).join('');
    $('#revs').innerHTML = j.reviews.length ? j.reviews.map((r) => `<div class="rev"><span class="s">${starTxt(r.stars)}</span> <span class="w">${esc(r.name || 'Anonymous')} · ${ago(r.at)}</span><p>${esc(r.comment)}</p></div>`).join('') : '<div class="empty">No written reviews yet.</div>';
  } catch (e) { $('#revs').innerHTML = '<div class="empty">Could not load reviews.</div>'; }
}
load();

$('#send').onclick = async () => {
  const msg = $('#msg'); msg.className = 'msg'; msg.textContent = ''; $('#send').disabled = true;
  try {
    const r = await fetch('/api/rate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ cid, stars, name: $('#name').value, comment: $('#text').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Something went wrong');
    store.set('boomlings.rate.stars', stars); store.set('boomlings.rate.name', $('#name').value); store.set('boomlings.rate.text', $('#text').value);
    msg.className = 'msg ok'; msg.textContent = 'Saved, thanks!'; $('#formTitle').textContent = 'Your rating (you can change it)'; load();
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
  $('#send').disabled = !stars;
};
</script>
</body>
</html>
