<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rate Boomlings</title>
<meta name="description" content="Rate this browser port of Boomlings and leave a review.">
<style>
  :root { --gold:#ffc81e; --ink:#fff; --shade:#00235a; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body { background:#1a6fc4 center top / cover fixed; color:var(--ink); font:700 16px/1.35 "Trebuchet MS",Verdana,"Segoe UI",sans-serif; text-shadow:0 2px 0 var(--shade); padding:18px 14px 60px; -webkit-font-smoothing:antialiased; }
  main { max-width:560px; margin:0 auto; display:none; }
  #loading { text-align:center; margin-top:30vh; color:var(--gold); font-size:20px; }
  img { display:block; max-width:100%; }
  .center { text-align:center; }
  .logo { margin:6px auto 0; width:min(440px,92%); }
  .head { margin:6px auto 18px; height:56px; }
  .head img { margin:0 auto; height:100%; width:auto; }

  /* panels use the game's own nine-slice art, drawn behind the content */
  .panel { position:relative; padding:26px 24px; margin-bottom:18px; }
  .panel > canvas.pbg { position:absolute; inset:0; width:100%; height:100%; z-index:0; }
  .panel > .in { position:relative; z-index:1; }
  .lbl { height:30px; margin:0 0 10px; }
  .lbl img { height:100%; width:auto; }

  .sum { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .big { text-align:center; min-width:104px; }
  .big img.num { margin:0 auto; height:58px; width:auto; }
  .big .small { font-size:14px; color:#cfe3ff; }
  .mini { display:flex; justify-content:center; gap:2px; margin-top:4px; }
  .mini img { width:20px; }
  .bars { flex:1; min-width:180px; }
  .bar { display:flex; align-items:center; gap:8px; font-size:13px; margin:5px 0; }
  .bar b { width:26px; color:var(--gold); text-align:right; }
  .bar i { flex:1; height:14px; background:#052a66; border:2px solid #fff; border-radius:99px; overflow:hidden; box-shadow:inset 0 2px 3px rgba(0,0,0,.5); }
  .bar u { display:block; height:100%; background:linear-gradient(#ffe14a,#ff9d00); }
  .bar span { width:26px; }

  .stars { display:flex; gap:6px; justify-content:center; margin:2px 0 10px; }
  .stars button { background:none; border:0; padding:0; cursor:pointer; transition:transform .12s; width:clamp(44px,13vw,60px); }
  .stars button img { width:100%; filter:grayscale(1) brightness(.42); transition:filter .12s; }
  .stars button.on img { filter:none; }
  .stars button:hover { transform:scale(1.14); }
  .stars button:active { transform:scale(.94); }

  .field { margin-top:12px; }
  .field .lab { height:22px; margin-bottom:4px; }
  .field .lab img { height:100%; width:auto; }
  input,textarea { width:100%; padding:10px 12px; font:700 17px "Trebuchet MS",Verdana,sans-serif; color:#fff; background:#0a3a8a; border:3px solid #fff; border-radius:10px; outline:0; text-shadow:none; box-shadow:inset 0 3px 6px rgba(0,0,0,.45); }
  input::placeholder,textarea::placeholder { color:#8fb2e8; }
  input:focus,textarea:focus { border-color:var(--gold); }
  textarea { min-height:96px; resize:vertical; }

  .send { display:block; margin:18px auto 0; background:none; border:0; padding:0; cursor:pointer; transition:transform .1s; }
  .send img { width:min(150px,45vw); }
  .send:hover { transform:scale(1.05); }
  .send:active { transform:scale(.95); }
  .send:disabled { filter:grayscale(1) brightness(.6); cursor:default; transform:none; }
  .msg { text-align:center; margin-top:10px; min-height:1.4em; }
  .msg.ok { color:#7dff9a; } .msg.err { color:#ff8a80; }

  .rev { padding:10px 12px; border-radius:10px; background:rgba(0,0,0,.2); margin-bottom:8px; }
  .rev:nth-child(odd) { background:rgba(0,0,0,.34); }
  .rev .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .rev .top b { color:var(--gold); }
  .rev .top small { color:#b9d3ff; font-weight:600; }
  .rev .st { display:flex; gap:1px; } .rev .st img { width:16px; } .rev .st img.off { filter:grayscale(1) brightness(.42); }
  .rev p { margin:4px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; font-weight:600; }
  .empty { text-align:center; color:#cfe3ff; padding:6px 0; }
  .back { display:flex; align-items:center; justify-content:center; gap:8px; color:#fff; text-decoration:none; margin-top:4px; }
  .back img { height:34px; width:auto; }
</style>
</head>
<body>
<div id="loading">Loading…</div>
<main id="page">
  <img class="logo" id="logo" alt="Boomlings">
  <div class="head" id="head"></div>

  <section class="panel"><div class="in">
    <div class="sum">
      <div class="big"><div id="avg"></div><div class="mini" id="miniStars"></div><div class="small" id="cnt"></div></div>
      <div class="bars" id="bars"></div>
    </div>
  </div></section>

  <section class="panel"><div class="in">
    <div class="lbl" id="formTitle"></div>
    <div class="stars" id="stars" role="radiogroup" aria-label="Stars"></div>
    <div class="field"><div class="lab" data-t="Name (optional)"></div><input id="name" maxlength="20" placeholder="Anonymous" autocomplete="nickname"></div>
    <div class="field"><div class="lab" data-t="Review (optional)"></div><textarea id="text" maxlength="500" placeholder="What do you like? What should be better?"></textarea></div>
    <button class="send" id="send" disabled aria-label="Send my rating"><img id="sendImg" alt="Send"></button>
    <div class="msg" id="msg"></div>
  </div></section>

  <section class="panel"><div class="in">
    <div class="lbl" id="revTitle"></div>
    <div id="revs"><div class="empty">Loading…</div></div>
  </div></section>

  <a class="back" href="/"><img id="backImg" alt=""> Back to the game</a>
</main>

<script type="module">
import { Atlas, nineSlice } from '/js/atlas.js';
import { BMFont } from '/js/bmfont.js';
import { loadImage } from '/js/plist.js';

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = (t) => { const s = Math.floor(Date.now() / 1000 - t); if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; if (s < 86400 * 30) return Math.floor(s / 86400) + ' d ago'; return new Date(t * 1000).toLocaleDateString(); };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };

// ---- the game's own art: sprite sheets and bitmap fonts
const [menu, ui, sheet2, big, gold, chat] = await Promise.all([
  Atlas.load('/assets/menuSheet-hd'), Atlas.load('/assets/BoomUISheet-hd'), Atlas.load('/assets/BoomSheet02-hd'),
  BMFont.load('/assets/bigFont-hd'), BMFont.load('/assets/goldFont-hd'), BMFont.load('/assets/chatFont-hd'),
]);
// a frame as a data URL (so it can sit in an <img>), with the sprite's own transparent padding trimmed away
const frameURL = (atlas, name) => { const f = atlas.frames[name]; if (!f) return ''; const c = document.createElement('canvas'); c.width = f.sw; c.height = f.sh; atlas.draw(c.getContext('2d'), name, f.sw / 2, f.sh / 2); return c.toDataURL(); };
// text in one of the game's fonts as a transparent image
const textURL = (font, text, scale = 1) => { const w = Math.ceil(font.measure(text, scale)) + 16, h = Math.ceil(font.lineHeight * scale) + 12, c = document.createElement('canvas'); c.width = w; c.height = h; font.draw(c.getContext('2d'), text, w / 2, h / 2, { scale }); return c.toDataURL(); };
const textImg = (font, text, scale, cls = '') => `<img class="${cls}" src="${textURL(font, text, scale)}" alt="${esc(text)}">`;

// background: the main menu's blue rays, like the game
{ const bg = menu.frames['MainMenuBG_001.png'] && frameURL(menu, 'MainMenuBG_001.png'); if (bg) document.body.style.backgroundImage = `url(${bg})`; }
$('#logo').src = frameURL(menu, 'boomlingslogo.png');
$('#head').innerHTML = textImg(big, 'RATE US!', 1.1);
$('#revTitle').innerHTML = textImg(gold, 'WHAT PEOPLE SAY', 0.62);
$('#sendImg').src = frameURL(menu, 'rateBtn_001.png');
$('#backImg').src = frameURL(menu, 'backArrow_001.png');
document.querySelectorAll('.lab[data-t]').forEach((e) => { e.innerHTML = textImg(gold, e.dataset.t.toUpperCase(), 0.48); });
const STAR = frameURL(ui, 'star_001.png');

// panels: the game's shop panel, nine-sliced to whatever size the content needs
const shop = menu.bitmap('shopTopBG_001.png');
function paintPanel(p) {
  let c = p.querySelector('canvas.pbg'); if (!c) { c = document.createElement('canvas'); c.className = 'pbg'; p.prepend(c); }
  const r = p.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1); c.width = Math.round(r.width * d); c.height = Math.round(r.height * d);
  const x = c.getContext('2d'); x.scale(d, d); nineSlice(x, shop, 0, 0, r.width, r.height, 36);
}
const ro = new ResizeObserver((es) => es.forEach((e) => paintPanel(e.target)));
document.querySelectorAll('.panel').forEach((p) => ro.observe(p));

// ---- one review per browser: a random id, remembered so a second visit edits the first review
let cid = store.get('boomlings.rate.cid');
if (!/^[a-f0-9]{32}$/.test(cid || '')) { cid = [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, '0')).join(''); store.set('boomlings.rate.cid', cid); }
let stars = +store.get('boomlings.rate.stars') || 0;
$('#name').value = store.get('boomlings.rate.name') || '';
$('#text').value = store.get('boomlings.rate.text') || '';
const title = () => { $('#formTitle').innerHTML = textImg(gold, stars && store.get('boomlings.rate.stars') ? 'YOUR RATING' : 'RATE THE GAME', 0.62); };
title();

function drawStars() {
  $('#stars').innerHTML = [1, 2, 3, 4, 5].map((n) => `<button type="button" class="${n <= stars ? 'on' : ''}" data-n="${n}" role="radio" aria-checked="${n === stars}" aria-label="${n} star${n > 1 ? 's' : ''}"><img src="${STAR}" alt=""></button>`).join('');
  $('#stars').querySelectorAll('button').forEach((b) => b.onclick = () => { stars = +b.dataset.n; drawStars(); });
  $('#send').disabled = !stars;
}
drawStars();
const starRow = (n, cls) => [1, 2, 3, 4, 5].map((i) => `<img src="${STAR}" class="${i <= n ? '' : 'off'}" alt="">`).join('');

async function load() {
  try {
    const j = await (await fetch('/api/ratings')).json();
    $('#avg').innerHTML = j.count ? textImg(big, j.average.toFixed(1), 1.2, 'num') : textImg(big, '–', 1.2, 'num');
    $('#miniStars').innerHTML = starRow(Math.round(j.average));
    $('#cnt').textContent = j.count ? j.count + (j.count === 1 ? ' review' : ' reviews') : 'no reviews yet';
    const max = Math.max(1, ...j.distribution);
    $('#bars').innerHTML = [5, 4, 3, 2, 1].map((n) => `<div class="bar"><b>${n}</b><i><u style="width:${j.distribution[n - 1] / max * 100}%"></u></i><span>${j.distribution[n - 1]}</span></div>`).join('');
    $('#revs').innerHTML = j.reviews.length ? j.reviews.map((r) => `<div class="rev"><div class="top"><b>${esc(r.name || 'Anonymous')}</b><span class="st">${starRow(r.stars)}</span><small>${ago(r.at)}</small></div><p>${esc(r.comment)}</p></div>`).join('') : '<div class="empty">No written reviews yet. Be the first!</div>';
  } catch (e) { $('#revs').innerHTML = '<div class="empty">Could not load reviews.</div>'; }
}
await load();

$('#send').onclick = async () => {
  const msg = $('#msg'); msg.className = 'msg'; msg.textContent = ''; $('#send').disabled = true;
  try {
    const r = await fetch('/api/rate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ cid, stars, name: $('#name').value, comment: $('#text').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Something went wrong');
    store.set('boomlings.rate.stars', stars); store.set('boomlings.rate.name', $('#name').value); store.set('boomlings.rate.text', $('#text').value);
    msg.className = 'msg ok'; msg.textContent = 'Thank you! Your rating was saved.'; title(); load();
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
  $('#send').disabled = !stars;
};

$('#loading').remove(); $('#page').style.display = 'block';
document.querySelectorAll('.panel').forEach(paintPanel);
</script>
</body>
</html>
