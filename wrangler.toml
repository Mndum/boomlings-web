name = "boomlings"
main = "server/worker.js"
compatibility_date = "2025-01-01"

# the game itself: every static file in this repo (see .assetsignore for what is left out);
# only /api/* runs the Worker, so everything is same-origin and needs no CORS
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "boomlings-private-server"
database_id = "1f610573-6219-4be5-a04b-39439231cd6b"

# the live room (real-time view + instant pranks)
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[vars]
REF_REWARD_NEW = "100"     # gold for the player who enters a code
REF_REWARD_OWNER = "100"   # gold for the code's owner
REF_MAX_PER_OWNER = "50"
IAP_COOLDOWN_DAYS = "3"    # one free gold pack per account per this many days
